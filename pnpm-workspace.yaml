packages:
  - apps/*
  - packages/*

catalog:
  "@alchemy.run/aws": 2.0.0-beta.87
  "@alchemy.run/cloudflare": 2.0.0-beta.87
  "@alchemy.run/test": 2.0.0-beta.87
  "@distilled.cloud/aws": 1.0.0-rc.20
  "@effect/platform-node": 4.1.4
  "@effect/tsgo": 0.69.0
  "@effect/vitest": 4.1.4
  "@oxlint/plugins": 1.93.0
  "@types/node": 24.19.2
  alchemy: 2.0.0-beta.87
  csv-parse: 7.0.3
  effect: 4.1.4
  knip: 6.45.1
  marked: 18.2.0
  oxfmt: 0.79.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007
  typescript: 7.0.2
  vite: 8.3.8
  vitest: 5.1.0

saveExact: true
engineStrict: true
strictPeerDependencies: true
verifyDepsBeforeRun: error
# The Effect integration patches local binaries; never modify shared store files.
packageImportMethod: copy

packageExtensions:
  # Alchemy's Cloudflare tooling pulls in capnp-es, whose optional compiler
  # integration uses the pre-native TypeScript API. Isolate that compiler.
  "@alchemy.run/cloudflare-runtime@2.0.0-beta.87":
    dependencies:
      typescript: 6.0.3
allowBuilds:
  msgpackr-extract@3.0.4: true
  workerd@1.20261026.1: true
