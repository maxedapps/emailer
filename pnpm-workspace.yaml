packages:
  - apps/*
  - packages/*

catalog:
  "@distilled.cloud/aws": 1.0.0-rc.12
  "@effect/platform-node": 4.0.0-rc.117
  "@effect/tsgo": 0.45.0
  "@oxlint/plugins": 1.82.0
  "@types/node": 24.13.6
  alchemy: 2.0.0-beta.79
  effect: 4.0.0-rc.117
  knip: 6.37.0
  oxfmt: 0.70.0
  oxlint: 1.82.0
  oxlint-tsgolint: 7.0.2001
  typescript: 7.0.2
  vite: 8.3.0
  vitest: 5.0.1

saveExact: true
engineStrict: true
strictPeerDependencies: true
verifyDepsBeforeRun: error
# The Effect integration patches local binaries; never modify shared store files.
packageImportMethod: copy

# Alchemy declares open-ended ">=4.0.0-rc.115 || >=4.0.0" Effect ranges.
# Catalogs constrain direct dependencies; these keep every transitive v4 package on one RC.
overrides:
  "effect@>=4.0.0-0": 4.0.0-rc.117
  "@effect/platform-node@>=4.0.0-0": 4.0.0-rc.117
  "@effect/platform-node-shared@>=4.0.0-0": 4.0.0-rc.117
  "@effect/platform-bun@>=4.0.0-0": 4.0.0-rc.117
  "@effect/sql-d1@>=4.0.0-0": 4.0.0-rc.117
  "@effect/sql-sqlite-do@>=4.0.0-0": 4.0.0-rc.117
  "@effect/vitest@>=4.0.0-0": 4.0.0-rc.117

packageExtensions:
  # Alchemy's Cloudflare tooling pulls in capnp-es, whose optional compiler
  # integration uses the pre-native TypeScript API. Isolate that compiler.
  "@alchemy.run/cloudflare-runtime@2.0.0-beta.79":
    dependencies:
      typescript: 6.0.3
allowBuilds:
  msgpackr-extract@3.0.4: true
  workerd@1.20260901.1: true
