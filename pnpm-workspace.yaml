packages:
  - apps/*
  - packages/*

catalog:
  "@distilled.cloud/aws": 1.0.0-rc.13
  "@effect/platform-node": 4.0.0
  "@effect/tsgo": 0.48.0
  "@effect/vitest": 4.0.0
  "@oxlint/plugins": 1.82.0
  "@types/node": 24.13.6
  alchemy: 2.0.0-beta.80
  csv-parse: 7.0.2
  effect: 4.0.0
  knip: 6.37.0
  marked: 18.0.14
  oxfmt: 0.70.0
  oxlint: 1.82.0
  oxlint-tsgolint: 7.0.2001
  typescript: 7.0.2
  vite: 8.3.0
  vitest: 5.0.1

saveExact: true
engineStrict: true
strictPeerDependencies: true
verifyDepsBeforeRun: error
# The Effect integration patches local binaries; never modify shared store files.
packageImportMethod: copy

packageExtensions:
  # Alchemy's Cloudflare tooling pulls in capnp-es, whose optional compiler
  # integration uses the pre-native TypeScript API. Isolate that compiler.
  "@alchemy.run/cloudflare-runtime@2.0.0-beta.80":
    dependencies:
      typescript: 6.0.3
allowBuilds:
  msgpackr-extract@3.0.4: true
  workerd@1.20260918.1: true
